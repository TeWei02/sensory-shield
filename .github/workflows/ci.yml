name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Pillow (icon regeneration only)
        run: python3 -m pip install --quiet --disable-pip-version-check pillow

      - name: Build package
        run: python3 scripts/build_zip.py

      - name: Verify package
        run: python3 scripts/verify_package.py

      - name: Run behavioural harness
        run: python3 tests/run.py

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: sensory-shield-package
          path: dist/*.zip
          if-no-files-found: error

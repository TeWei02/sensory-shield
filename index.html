<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sensory Shield — Downloads</title>
    <link rel="stylesheet" href="./styles.css">
  </head>
  <body>
    <main class="wrap">
      <h1 class="title">Sensory Shield</h1>
      <p class="subtitle">為神經多樣性優化的閱讀延展工具</p>

      <div class="buttons">
        <!-- 將下面兩個 href 換成你的 Google Drive / GitHub Releases 下載連結 -->
        <a id="macBtn" class="big-btn mac" href="https://example.com/sensory-shield-mac.dmg" download>
          Download for Mac
        </a>

        <a id="winBtn" class="big-btn win" href="https://example.com/sensory-shield-win.zip" download>
          Download for Windows
        </a>
      </div>

      <p class="note">你可以把安裝檔託管在 Google Drive 或 GitHub Releases，然後把連結貼到按鈕的 href。</p>
    </main>
  </body>
</html>

<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sensory Shield</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main class="container">
      <div class="header">
        <span class="logo">🛡️</span>
        <span class="title">Sensory Shield</span>
      </div>

      <button id="neutralizeBtn" class="primary">
        啟動感官煞車 (Neutralize Page)
      </button>

      <details id="settingsPanel" class="settings-panel">
        <summary class="settings-toggle">⚙️ 設定 (Settings)</summary>

        <form id="settingsForm" class="settings-body" novalidate>
          <label class="field-label" for="apiKey">API Key</label>
          <input
            id="apiKey"
            type="password"
            class="field-input"
            placeholder="sk-..."
            autocomplete="off"
          />

          <label class="field-label" for="modelName">Model</label>
          <input
            id="modelName"
            type="text"
            class="field-input"
            placeholder="gpt-4o-mini"
          />

          <label class="field-label" for="baseUrl">API Base URL</label>
          <input
            id="baseUrl"
            type="url"
            class="field-input"
            placeholder="https://api.openai.com"
          />

          <p class="hint">
            留空 API Key 將使用內建規則式簡化（無需網路）。<br />
            Leave API Key empty to use built-in rule-based simplification (offline).
          </p>

          <div class="settings-actions">
            <button type="submit" id="saveBtn" class="secondary">儲存 (Save)</button>
            <span id="saveStatus" class="save-status" aria-live="polite"></span>
          </div>
        </form>
      </details>
    </main>

    <script src="popup.js" type="module"></script>
  </body>
</html>
